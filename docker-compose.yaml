services:
  auth-service:
    container_name: auth
    build:
      context: ./microservice-auth
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ACTIVE_PROFILE:
      AMQP_URL:
      PG_USER: ${PG_AUTH_USER:-postgres}
      PG_PASSWORD: ${PG_AUTH_PASSWORD:-postgres}
      PG_DB: ${PG_AUTH_DB}
      PG_URL: jdbc:postgresql://auth_db:5432/${PG_DB:-postgres}
    depends_on:
      auth_db:
        condition: service_started
      rabbitmq:
        condition: service_started

  users-service:
    container_name: users
    build:
      context: ./microservice-users
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      ACTIVE_PROFILE:
      AMQP_URL:
      PG_USER: ${PG_USERS_USER:-postgres}
      PG_PASSWORD: ${PG_USERS_PASSWORD:-postgres}
      PG_DB: ${PG_USERS_DB:-postgres}
      PG_URL: jdbc:postgresql://users_db:5433/${PG_DB:-postgres}
    depends_on:
      users_db:
        condition: service_started
      rabbitmq:
        condition: service_started

  auth_db:
    container_name: auth_db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PG_AUTH_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_AUTH_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_AUTH_DB:-postgres}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  users_db:
    container_name: users_db
    image: postgres:17-alpine
    command: -p 5433
    environment:
      POSTGRES_USER: ${PG_USERS_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_USERS_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_USERS_DB:-postgres}
    env_file:
      - .env
    ports:
      - "5433:5433"
    volumes:
      - users_db_data:/var/lib/postgresql/data

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq-local
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  auth_db_data:
  users_db_data:
  rabbitmq_data: